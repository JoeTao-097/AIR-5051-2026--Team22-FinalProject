# UR5e robot configuration
robot:
  ip: "192.168.1.3"              # UR5e controller IP (adjust to your setup)
  reverse_port: 50001
  script_sender_port: 50002
  trajectory_port: 50003

  # Safety limits
  max_force: 20.0                 # N — protective stop threshold
  max_velocity: 0.25              # m/s
  max_acceleration: 1.0           # m/s²

# Force control parameters
force_control:
  target_force: 8.0               # N — desired contact force during scanning
  force_tolerance: 2.0            # N — acceptable force deviation
  damping: 0.5                    # Impedance damping coefficient
  task_frame: [0, 0, 0, 0, 0, 0]
  selection_vector: [0, 0, 1, 0, 0, 0]  # Z-axis force control
  force_type: 2                   # Frame-relative
  speed_limits: [0.5, 0.5, 0.5, 1.0, 1.0, 1.0]
